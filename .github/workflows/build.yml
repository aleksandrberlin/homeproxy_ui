name: Build installer

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build self-extracting installer
        run: sh build.sh

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: homeproxy-ui-install.sh
